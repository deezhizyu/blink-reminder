[package]
name = "blink-reminder"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
futures = "0.3.34"
gpui = "0.2.2"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
tray-icon = "0.26.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1.34"
