[package]
name = "blink-reminder"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1"
futures = "0.3.34"
gpui = "0.2.2"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
tray-icon = "0.26.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1.34"
